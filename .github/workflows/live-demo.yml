name: Запустить приложение в браузере

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ветка проекта (main, lab1, lab2, lab3, lab4)"
        default: "main"
        required: true
      device:
        description: "Устройство"
        type: choice
        options: [iPhone, iPad]
        default: iPhone
      minutes:
        description: "Сколько минут держать сеанс (до 90)"
        default: "60"

jobs:
  remote:
    name: remote
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Получить исходный код приложения
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # Ветки lab1…lab4 заморожены раньше, чем появился веб-пульт, поэтому
      # его файлы всегда берутся из main — независимо от выбранной ветки.
      - name: Получить файлы пульта из main
        uses: actions/checkout@v4
        with:
          ref: main
          path: .pult

      - name: Установить Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Выбрать Xcode
        run: |
          # idb_companion 1.6 собран под Xcode 26 и подгружает CoreSimulator
          # из выбранного Xcode, поэтому берём самый новый Xcode 26, если он есть.
          echo "Установленные Xcode:"
          ls -d /Applications/Xcode*.app || true
          NEWEST=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$NEWEST" ]; then
            echo "Выбираю $NEWEST"
            sudo xcode-select -s "$NEWEST/Contents/Developer"
          else
            echo "Xcode 26 не найден, остаётся текущий"
          fi
          xcodebuild -version

      - name: Установить XcodeGen, idb и cloudflared
        env:
          IDB_VERSION: "1.6.1"
          IDB_SHA256: "f59cadedbb05fe21c11522ee297cd8827b758136e27837a647267682cb2c80bb"
        run: |
          set -e
          brew install xcodegen cloudflared

          # Готовая сборка idb_companion берётся прямо из релиза facebook/idb:
          # формула Homebrew требует Xcode 26 ещё до установки, а сам бинарник
          # собирать не нужно. Контрольная сумма сверяется с опубликованной.
          ARCHIVE="$RUNNER_TEMP/idb-companion.tar.gz"
          curl -fsSL -o "$ARCHIVE" \
            "https://github.com/facebook/idb/releases/download/v${IDB_VERSION}/idb-companion.macos-arm64.tar.gz"
          echo "${IDB_SHA256}  ${ARCHIVE}" | shasum -a 256 -c -

          # Дерево распаковывается целиком: idb_companion ищет папку Resources
          # рядом со своим исполняемым файлом.
          COMPANION="$HOME/idb-companion"
          mkdir -p "$COMPANION"
          tar -xzf "$ARCHIVE" -C "$COMPANION"
          if [ ! -x "$COMPANION/idb_companion" ]; then
            FOUND=$(find "$COMPANION" -name idb_companion -type f -perm -u+x | head -1)
            COMPANION=$(dirname "$FOUND")
          fi
          xattr -dr com.apple.quarantine "$COMPANION" || true
          echo "$COMPANION" >> "$GITHUB_PATH"
          export PATH="$COMPANION:$PATH"

          # Клиент той же версии, что и сервер.
          python -m pip install --upgrade pip
          python -m pip install "fb-idb==${IDB_VERSION}"

          echo "--- проверка ---"
          idb_companion --version
          idb --help >/dev/null && echo "idb установлен"

      - name: Сгенерировать проект Xcode
        run: xcodegen generate --spec project.yml

      - name: Подобрать симулятор
        id: sim
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, subprocess, sys

          family = os.environ["DEVICE"]
          data = json.loads(subprocess.check_output(
              ["xcrun", "simctl", "list", "devices", "available", "-j"]))

          available = []
          for runtime, devices in data["devices"].items():
              if "iOS" in runtime:
                  available.extend(d for d in devices if d.get("isAvailable"))

          preferred = {
              "iPhone": ["iPhone 17 Pro", "iPhone 16 Pro", "iPhone 17", "iPhone 16",
                         "iPhone 15 Pro", "iPhone 15"],
              "iPad": ["iPad Pro 13-inch (M5)", "iPad Pro 13-inch (M4)",
                       "iPad Pro 11-inch (M5)", "iPad Pro 11-inch (M4)",
                       "iPad Air 13-inch (M3)", "iPad Air 13-inch (M2)"],
          }[family]

          for name in preferred:
              for device in available:
                  if device["name"] == name:
                      print(f"udid={device['udid']}")
                      print(f"name={device['name']}")
                      sys.exit(0)
          for device in available:
              if device["name"].startswith(family):
                  print(f"udid={device['udid']}")
                  print(f"name={device['name']}")
                  sys.exit(0)
          sys.exit(f"Не найден симулятор {family}")
          PY
        env:
          DEVICE: ${{ inputs.device }}

      - name: Собрать и установить приложение
        run: |
          set -e
          xcodebuild build \
            -project TripWardrobe.xcodeproj \
            -scheme TripWardrobe \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_VERSION=5.0

          UDID="${{ steps.sim.outputs.udid }}"

          # simctl bootstatus иногда ждёт готовности бесконечно, поэтому
          # состояние симулятора опрашивается вручную и с ограничением времени.
          wait_booted () {
            for _ in $(seq 1 60); do
              STATE=$(xcrun simctl list devices -j \
                | python3 -c "import json,sys;d=json.load(sys.stdin);print(next((x['state'] for g in d['devices'].values() for x in g if x['udid']=='$UDID'),'?'))")
              if [ "$STATE" = "Booted" ]; then
                echo "Симулятор загружен"
                return 0
              fi
              sleep 5
            done
            return 1
          }

          xcrun simctl boot "$UDID" 2>/dev/null || true
          if ! wait_booted; then
            echo "Симулятор не поднялся, пробую ещё раз"
            xcrun simctl shutdown "$UDID" 2>/dev/null || true
            sleep 5
            xcrun simctl boot "$UDID" 2>/dev/null || true
            wait_booted || { echo "Симулятор так и не загрузился"; exit 1; }
          fi
          # Дать системным службам симулятора дойти до рабочего состояния.
          sleep 15

          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "Приложение: $APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" by.gstu.itp41.TripWardrobe

      - name: Сгенерировать пароль
        id: secret
        run: |
          PASS=$(python3 -c "import secrets,string; print(''.join(secrets.choice(string.ascii_uppercase+string.digits) for _ in range(4))+'-'+''.join(secrets.choice(string.ascii_uppercase+string.digits) for _ in range(4)))")
          echo "password=$PASS" >> "$GITHUB_OUTPUT"

      - name: Запустить веб-пульт
        run: |
          # Поднять связь с симулятором и убедиться, что управление работает.
          idb list-targets || true
          idb connect "${{ steps.sim.outputs.udid }}" || true
          echo "--- describe ---"
          idb describe --udid "${{ steps.sim.outputs.udid }}" --json | head -c 600 || true
          echo
          echo "--- пробное нажатие ---"
          idb ui tap --udid "${{ steps.sim.outputs.udid }}" 200 400 && echo "управление работает" || echo "УПРАВЛЕНИЕ НЕ РАБОТАЕТ"

          SIM_UDID="${{ steps.sim.outputs.udid }}" \
          REMOTE_PASSWORD="${{ steps.secret.outputs.password }}" \
          BUNDLE_ID="by.gstu.itp41.TripWardrobe" \
          PORT=8080 \
          nohup python3 .pult/tools/remote/server.py > remote-server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/; then
              echo "Пульт отвечает"; break
            fi
            sleep 1
          done
          cat remote-server.log || true

      - name: Открыть внешний адрес
        id: tunnel
        run: |
          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 \
            > tunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -1 || true)
            [ -n "$URL" ] && break
            sleep 2
          done
          if [ -z "$URL" ]; then
            echo "Не удалось поднять туннель:"; cat tunnel.log; exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: ССЫЛКА НА ПРИЛОЖЕНИЕ (нажмите сюда)
        run: |
          {
            echo "## Приложение «Гардероб» запущено"
            echo
            echo "# [ОТКРЫТЬ ПРИЛОЖЕНИЕ](${{ steps.tunnel.outputs.url }})"
            echo
            echo "Адрес: ${{ steps.tunnel.outputs.url }}"
            echo
            echo "**Пароль:** \`${{ steps.secret.outputs.password }}\`"
            echo
            echo "Устройство: ${{ steps.sim.outputs.name }} · ветка \`${{ inputs.ref }}\`"
            echo
            echo "Сеанс работает ${{ inputs.minutes }} мин, затем отключается сам."
            echo "Закончить раньше — кнопка **Cancel workflow** справа вверху."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "==========================================================="
          echo "  ССЫЛКА: ${{ steps.tunnel.outputs.url }}"
          echo "  ПАРОЛЬ: ${{ steps.secret.outputs.password }}"
          echo "==========================================================="

      # Файл со ссылкой доступен для скачивания сразу, не дожидаясь конца
      # сеанса, — из него ссылку забирает скрипт «Запустить приложение.cmd».
      - name: Выложить ссылку файлом
        run: |
          mkdir -p link
          {
            echo "${{ steps.tunnel.outputs.url }}"
            echo "${{ steps.secret.outputs.password }}"
          } > link/link.txt
          cat link/link.txt

      - name: Опубликовать файл со ссылкой
        uses: actions/upload-artifact@v4
        with:
          name: link
          path: link/link.txt

      - name: Держать сеанс открытым
        run: |
          MINUTES=$(( ${{ inputs.minutes }} ))
          [ "$MINUTES" -gt 90 ] && MINUTES=90
          echo "Сеанс продлится $MINUTES мин. Досрочно — кнопка Cancel workflow."
          sleep $(( MINUTES * 60 ))

      - name: Журнал пульта
        if: always()
        run: tail -60 remote-server.log || true
