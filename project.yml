name: TripWardrobe
options:
  bundleIdPrefix: by.gstu.itp41
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ru

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    SWIFT_EMIT_LOC_STRINGS: "YES"

targets:
  TripWardrobe:
    type: application
    platform: iOS
    sources:
      - path: TripWardrobe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.gstu.itp41.TripWardrobe
        PRODUCT_NAME: TripWardrobe
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Гардероб"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        GENERATE_INFOPLIST_FILE: "YES"
        DEVELOPMENT_ASSET_PATHS: ""

  TripWardrobeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TripWardrobeTests
    dependencies:
      - target: TripWardrobe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.gstu.itp41.TripWardrobeTests
        GENERATE_INFOPLIST_FILE: "YES"

  TripWardrobeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TripWardrobeUITests
    dependencies:
      - target: TripWardrobe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.gstu.itp41.TripWardrobeUITests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  TripWardrobe:
    build:
      targets:
        TripWardrobe: all
        TripWardrobeTests: [test]
        TripWardrobeUITests: [test]
    test:
      targets:
        - TripWardrobeTests
        - TripWardrobeUITests
      gatherCoverageData: false
    run:
      config: Debug
